<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0c">
    <meta name="description" content="登录 QuantFlow 量化策略与模拟盘管理系统">
    <title>登录 · QuantFlow</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/auth.css?v=20260812-auth">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-context" aria-label="QuantFlow 系统介绍">
        <a class="auth-brand" href="/login.html" aria-label="QuantFlow 登录页">
          <span class="auth-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>Quant<b>Flow</b></span>
        </a>
        <div class="auth-context-copy">
          <p class="auth-kicker">STRATEGY OPERATIONS</p>
          <h1>策略、模拟盘与风险状态，一处管理。</h1>
          <p>登录后可查看行情、新闻判断、组合策略和模拟盘表现。系统不开放自主注册，账号由管理员统一创建。</p>
        </div>
        <footer>QuantFlow · 研究与模拟交易环境</footer>
      </section>

      <section class="auth-panel">
        <div class="auth-card">
          <h2>登录系统</h2>
          <p class="auth-subtitle">请输入管理员为你创建的账号。</p>
          <div class="setup-card hidden" id="setupMessage" role="alert">
            系统尚未初始化。请在首次启动前设置 <code>QUANTFLOW_ADMIN_USERNAME</code> 和 <code>QUANTFLOW_ADMIN_PASSWORD</code>。
          </div>
          <form class="auth-form" id="loginForm">
            <label>
              <span>登录账号</span>
              <input id="username" name="username" type="text" minlength="3" maxlength="32" autocomplete="username" spellcheck="false" required autofocus>
            </label>
            <label>
              <span>密码</span>
              <input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required>
            </label>
            <button id="loginButton" type="submit">登录</button>
          </form>
          <p class="auth-message" id="loginMessage" role="alert" aria-live="polite"></p>
          <p class="auth-note">本页面不提供注册入口。如需账号或重置密码，请联系系统管理员。</p>
        </div>
      </section>
    </main>
    <script type="module" src="/login.js?v=20260812-auth"></script>
  </body>
</html>
